<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eaf7"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3166"/>
      <stop offset="0.5" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#0a0c22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#b86bff"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="1" stop-color="#3d6bff"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#141a45"/>
      <stop offset="1" stop-color="#05061a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="darkbg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#05061a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#darkbg)"/>

  <g filter="url(#shadow)">
    <!-- Antenna -->
    <rect x="249" y="96" width="14" height="62" rx="7" fill="#2a3166"/>
    <!-- Side ear pieces -->
    <rect x="70" y="238" width="34" height="84" rx="17" fill="url(#head)" stroke="url(#rim)" stroke-width="4"/>
    <rect x="408" y="238" width="34" height="84" rx="17" fill="url(#head)" stroke="url(#rim)" stroke-width="4"/>
    <!-- Head -->
    <rect x="94" y="150" width="324" height="256" rx="96" fill="url(#head)" stroke="url(#rim)" stroke-width="5"/>
  </g>

  <!-- Antenna light -->
  <g filter="url(#glow)">
    <circle cx="256" cy="90" r="17" fill="url(#eye)"/>
  </g>
  <circle cx="250" cy="84" r="5" fill="#fff" opacity="0.85"/>

  <!-- Face screen -->
  <rect x="128" y="196" width="256" height="170" rx="76" fill="url(#screen)"/>

  <!-- Eyes (rounded squares) -->
  <g filter="url(#glow)">
    <rect x="177" y="244" width="56" height="66" rx="24" fill="url(#eye)"/>
    <rect x="279" y="244" width="56" height="66" rx="24" fill="url(#eye)"/>
  </g>
  <ellipse cx="195" cy="262" rx="8" ry="11" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="297" cy="262" rx="8" ry="11" fill="#ffffff" opacity="0.85"/>

  <!-- Mouth -->
  <path d="M236 337 Q256 351 276 337" fill="none" stroke="#7ff0ff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Cheek lights -->
  <circle cx="152" cy="330" r="6" fill="#b86bff" opacity="0.8"/>
  <circle cx="360" cy="330" r="6" fill="#b86bff" opacity="0.8"/>
</svg>
