  <g filter="url(#glow)">
    <circle cx="196" cy="272" r="26" fill="url(#uniEye)"/>
    <circle cx="316" cy="272" r="26" fill="url(#uniEye)"/>
  </g>
  <circle cx="196" cy="272" r="12" fill="#230b36"/>
  <circle cx="316" cy="272" r="12" fill="#230b36"/>
  <circle cx="188" cy="262" r="7" fill="#ffffff"/>
  <circle cx="308" cy="262" r="7" fill="#ffffff"/>
  <!-- Blush & Smile -->
