  <path d="M140 184 L104 98 L208 152 Z" fill="#ffffff" stroke="#ff99d6" stroke-width="5" stroke-linejoin="round"/>
  <path d="M146 170 L124 118 L188 152 Z" fill="#ffb3e1"/>
