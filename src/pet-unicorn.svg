  <rect x="104" y="152" width="304" height="252" rx="122" fill="#fcf7ff" stroke="#e4b8ff" stroke-width="5"/>
  <!-- Rainbow Mane Curls -->
  <circle cx="192" cy="154" r="28" fill="#ff73b9"/>
  <circle cx="236" cy="148" r="30" fill="#ffcf5c"/>
  <circle cx="282" cy="148" r="30" fill="#5ce8ff"/>
  <circle cx="322" cy="156" r="26" fill="#b380ff"/>
