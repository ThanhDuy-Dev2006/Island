  </g>
  <line x1="238" y1="112" x2="274" y2="122" stroke="#ffffff" stroke-width="3.5" opacity="0.85"/>
  <line x1="244" y1="82" x2="268" y2="90" stroke="#ffffff" stroke-width="3.5" opacity="0.85"/>
