<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgUni" cx="0.5" cy="0.38" r="0.8">
      <stop offset="0" stop-color="#33184a"/>
      <stop offset="1" stop-color="#0b0514"/>
    </radialGradient>
    <linearGradient id="uniHorn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff89e"/>
      <stop offset="0.5" stop-color="#ff85d8"/>
      <stop offset="1" stop-color="#61efff"/>
    </linearGradient>
    <linearGradient id="uniEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b58cff"/>
      <stop offset="1" stop-color="#ff59b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgUni)"/>
