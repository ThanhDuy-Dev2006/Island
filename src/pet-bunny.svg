<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkbg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3b1d4a"/>
      <stop offset="1" stop-color="#0b0614"/>
    </radialGradient>
    <linearGradient id="bunBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5fa"/>
      <stop offset="1" stop-color="#e4cde8"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa6ce"/>
      <stop offset="1" stop-color="#ff5c9e"/>
    </linearGradient>
    <linearGradient id="bunEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff66a8"/>
      <stop offset="1" stop-color="#9b2cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#darkbg)"/>
  <!-- Long Bunny Ears -->
  <g transform="rotate(-10 185 180)">
    <rect x="148" y="46" width="68" height="176" rx="34" fill="url(#bunBody)" stroke="#ff94c8" stroke-width="5"/>
    <rect x="164" y="68" width="36" height="130" rx="18" fill="url(#earInner)" opacity="0.85"/>
  </g>
  <g transform="rotate(10 327 180)">
    <rect x="296" y="46" width="68" height="176" rx="34" fill="url(#bunBody)" stroke="#ff94c8" stroke-width="5"/>
    <rect x="312" y="68" width="36" height="130" rx="18" fill="url(#earInner)" opacity="0.85"/>
  </g>
  <!-- Chubby Mochi Head -->
  <rect x="98" y="176" width="316" height="244" rx="118" fill="url(#bunBody)" stroke="#ff94c8" stroke-width="5"/>
  <!-- Glowing Ruby-Violet Eyes -->
  <g filter="url(#glow)">
    <ellipse cx="196" cy="288" rx="24" ry="30" fill="url(#bunEye)"/>
    <ellipse cx="316" cy="288" rx="24" ry="30" fill="url(#bunEye)"/>
  </g>
  <circle cx="188" cy="275" r="8" fill="#ffffff"/>
  <circle cx="308" cy="275" r="8" fill="#ffffff"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="150" cy="322" rx="20" ry="12" fill="#ff6ea7" opacity="0.65"/>
  <ellipse cx="362" cy="322" rx="20" ry="12" fill="#ff6ea7" opacity="0.65"/>
  <!-- Cute Nose & Mouth -->
  <ellipse cx="256" cy="312" rx="10" ry="7" fill="#ff4d94"/>
  <path d="M238 330 Q247 342 256 330 Q265 342 274 330" fill="none" stroke="#c84b85" stroke-width="5.5" stroke-linecap="round"/>
</svg>