<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="darkbg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#193829"/>
      <stop offset="1" stop-color="#050f0a"/>
    </radialGradient>
    <linearGradient id="pandaHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce5e0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dff9b"/>
      <stop offset="1" stop-color="#1dc956"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#darkbg)"/>
  <!-- Round Black Panda Ears -->
  <circle cx="136" cy="158" r="54" fill="#14181f" stroke="#4be884" stroke-width="4"/>
  <circle cx="376" cy="158" r="54" fill="#14181f" stroke="#4be884" stroke-width="4"/>
  <!-- Panda Head -->
  <rect x="96" y="156" width="320" height="256" rx="120" fill="url(#pandaHead)" stroke="#4be884" stroke-width="5"/>
  <!-- Cute Bamboo Sprout on Top -->
  <g filter="url(#glow)">
    <path d="M256 156 L256 112" stroke="#2ee068" stroke-width="6" stroke-linecap="round"/>
    <path d="M256 122 C226 106 218 82 248 86 C262 88 260 110 256 122 Z" fill="url(#leafGrad)"/>
    <path d="M256 128 C286 112 296 90 268 92 C254 94 256 114 256 128 Z" fill="url(#leafGrad)"/>
  </g>
  <!-- Black Eye Patches -->
  <ellipse cx="192" cy="276" rx="44" ry="50" transform="rotate(-12 192 276)" fill="#14181f"/>
  <ellipse cx="320" cy="276" rx="44" ry="50" transform="rotate(12 320 276)" fill="#14181f"/>
  <!-- Sparkling Eyes -->
  <circle cx="196" cy="272" r="18" fill="#ffffff"/>
  <circle cx="316" cy="272" r="18" fill="#ffffff"/>
  <circle cx="190" cy="266" r="7" fill="#5ce892"/>
  <circle cx="310" cy="266" r="7" fill="#5ce892"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="144" cy="326" rx="18" ry="11" fill="#ff7aa8" opacity="0.7"/>
  <ellipse cx="368" cy="326" rx="18" ry="11" fill="#ff7aa8" opacity="0.7"/>
  <!-- Nose & Mouth -->
  <ellipse cx="256" cy="312" rx="13" ry="9" fill="#14181f"/>
  <path d="M236 330 Q246 342 256 330 Q266 342 276 330" fill="none" stroke="#14181f" stroke-width="5.5" stroke-linecap="round"/>
</svg>