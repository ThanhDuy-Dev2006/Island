<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgAxo" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3b1636"/>
      <stop offset="1" stop-color="#0f0512"/>
    </radialGradient>
    <linearGradient id="axoSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="0.65" stop-color="#ff8ec6"/>
      <stop offset="1" stop-color="#e3529b"/>
    </linearGradient>
    <linearGradient id="axoGill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d94"/>
      <stop offset="1" stop-color="#ff0a6c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgAxo)"/>
  <!-- 6 Coral Gill Fronds (3 Left, 3 Right) -->
  <g filter="url(#glow)" fill="url(#axoGill)">
    <ellipse cx="78" cy="192" rx="44" ry="15" transform="rotate(26 78 192)"/>
    <ellipse cx="64" cy="252" rx="48" ry="15" transform="rotate(4 64 252)"/>
    <ellipse cx="78" cy="312" rx="44" ry="15" transform="rotate(-22 78 312)"/>
    <ellipse cx="434" cy="192" rx="44" ry="15" transform="rotate(-26 434 192)"/>
    <ellipse cx="448" cy="252" rx="48" ry="15" transform="rotate(-4 448 252)"/>
    <ellipse cx="434" cy="312" rx="44" ry="15" transform="rotate(22 434 312)"/>
  </g>
  <!-- Axolotl Head -->
  <rect x="104" y="156" width="304" height="236" rx="116" fill="url(#axoSkin)" stroke="#ffb8dc" stroke-width="5"/>
  <!-- Water Bubbles -->
  <circle cx="144" cy="116" r="14" fill="none" stroke="#85f2ff" stroke-width="3.5" opacity="0.85"/>
  <circle cx="372" cy="102" r="10" fill="none" stroke="#85f2ff" stroke-width="3" opacity="0.75"/>
  <circle cx="394" cy="134" r="6" fill="#85f2ff" opacity="0.65"/>
  <!-- Glossy Eyes -->
  <g filter="url(#glow)">
    <circle cx="192" cy="268" r="24" fill="#29091e"/>
    <circle cx="320" cy="268" r="24" fill="#29091e"/>
    <circle cx="192" cy="268" r="16" fill="#5ce8ff"/>
    <circle cx="320" cy="268" r="16" fill="#5ce8ff"/>
  </g>
  <circle cx="192" cy="268" r="9" fill="#1c0514"/>
  <circle cx="320" cy="268" r="9" fill="#1c0514"/>
  <circle cx="185" cy="259" r="6.5" fill="#ffffff"/>
  <circle cx="313" cy="259" r="6.5" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="150" cy="296" rx="20" ry="11" fill="#ff3b8d" opacity="0.55"/>
  <ellipse cx="362" cy="296" rx="20" ry="11" fill="#ff3b8d" opacity="0.55"/>
  <!-- Cute Wide Smile -->
  <path d="M226 306 Q256 328 286 306" fill="none" stroke="#591138" stroke-width="6" stroke-linecap="round"/>
</svg>
